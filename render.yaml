# Render Blueprint — defines the backend service.
# https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in the Render dashboard use
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# and creates the service below. Any envVar marked `sync: false` is a
# secret that is NOT stored in this file — Render will prompt you to fill
# it in from the dashboard (copy the value from the local .env file, which
# is not committed to the repo).
#
# This is a long-lived process on purpose (not a serverless function):
# POST /chat/stream holds a background thread + blocking queue open for the
# lifetime of the SSE connection (see backend/app/orchestrator/api.py) —
# this only works on a platform that keeps the process running, which is
# exactly what a Render "web service" (as opposed to a serverless/edge
# function) provides.

services:
  - type: web
    name: backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      # LLM provider (see app/adapters/deepseek_adapter.py)
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat

      # Session storage — durable Postgres with a Redis cache-aside layer
      # (see app/orchestrator/conversation_repository.py)
      - key: SESSION_STORE_BACKEND
        value: supabase_cached
      - key: REDIS_URL
        sync: false
      - key: CONVERSATION_DATABASE_URL
        sync: false

      # Read-only knowledge base for RAG and the raw course catalog (see
      # app/adapters/knowledge_db_adapter.py)
      - key: KNOWLEDGE_DATABASE_URL
        sync: false
      # Used only to embed RAG queries (text-embedding-3-small) — unrelated
      # to DEEPSEEK_API_KEY above, see app/adapters/openai_embedding_adapter.py
      - key: OPENAI_API_KEY
        sync: false

      # Supabase Storage for checklist file uploads (see
      # app/adapters/supabase_storage_adapter.py)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CHECKLIST_STORAGE_BUCKET
        value: checklist-documents

      # Self-issued JWT auth (see app/domains/auth/security.py) — must be a
      # long random string; app refuses to start if this is missing/short.
      - key: JWT_SECRET_KEY
        sync: false

      # Email verification codes for registration (see
      # app/domains/auth/service.py + app/adapters/resend_email_adapter.py).
      # Without RESEND_API_KEY, the adapter silently falls back to printing
      # the code to the server log instead of emailing it — fine for local
      # dev, but means real users on this deployment would never receive
      # their verification code, so this must be set here.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false

      # Comma-separated list of allowed frontend origins (see app/main.py)
      # — fill this in with the deployed Vercel URL once it exists, e.g.
      # https://your-app.vercel.app
      - key: CORS_ALLOW_ORIGINS
        sync: false
