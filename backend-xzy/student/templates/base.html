<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUS MSc DFT Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="app--student">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/">
        <span class="brand__mark">D</span>
        <span>MSc DFT Assistant</span>
        <span class="brand__role">Student</span>
      </a>
      <nav class="nav">
        <a href="/" {% if active == 'home' %}aria-current="page"{% endif %}>Start</a>
        <a href="/settings" {% if active == 'settings' %}aria-current="page"{% endif %}>Settings</a>
      </nav>
    </div>
  </header>
  <main class="wrap {% block wrapmod %}{% endblock %}">
    {% block body %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
