<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSc DFT — Admin Console</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="app--admin">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/">
        <span class="brand__mark">D</span>
        <span>MSc DFT Console</span>
        <span class="brand__role">Staff</span>
      </a>
      <nav class="nav">
        <a href="/" {% if active == 'home' %}aria-current="page"{% endif %}>Edit data</a>
        <a href="/history" {% if active == 'history' %}aria-current="page"{% endif %}>History / rollback</a>
        <a href="/settings" {% if active == 'settings' %}aria-current="page"{% endif %}>Credentials</a>
      </nav>
    </div>
  </header>
  <main class="wrap {% block wrapmod %}{% endblock %}">
    {% block body %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
